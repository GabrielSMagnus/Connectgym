<body>

<h2>Bora conectar seu primeiro treino?</h2>

<form class="contact-form" id="contactForm">
  <label>
    Nome
    <input type="text" name="nome" required placeholder="Seu nome completo">
  </label>

  <label>
    WhatsApp
    <input type="tel" name="whatsapp" required placeholder="(48) 9 9999-9999">
  </label>

  <label>
    Mensagem
    <textarea name="mensagem" rows="4" placeholder="Quero saber mais sobre os planos..."></textarea>
  </label>

  <button type="submit" class="btn btn-accent">Enviar mensagem</button>
  <p class="form-status" id="formStatus" role="status"></p>
</form>

<h3>Endereço</h3>
<p class="placeholder-note">R. Angélica Colodel Bettiol, 59 - Centro, Urussanga - SC, 88840-000</p>

<p>
  Seg a Sex: 5h às 22h<br>
  Sábado: 7h30 às 14h<br>
  Domingo: 9h às 12h
</p>
